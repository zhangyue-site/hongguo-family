name: Ship iOS to ASC
run-name: Ship iOS ${{ inputs.build_name }} (${{ inputs.build_number }}) → TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version shown to testers
        required: true
      build_number:
        description: Unique ascending Apple build number
        required: true

permissions:
  contents: read

concurrency:
  group: ship-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-upload:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned device app
        run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ship/Payload
          cp -R build/ios/iphoneos/Runner.app build/ship/Payload/
          cd build/ship
          zip -qry ../hongguo-ios-unsigned.ipa Payload

      - name: Import signing material into temporary keychain
        env:
          IOS_DIST_KEY_PEM: ${{ secrets.IOS_DIST_KEY_PEM }}
          IOS_DIST_CERT: ${{ secrets.IOS_DIST_CERT }}
          IOS_WWDR_G4: ${{ secrets.IOS_WWDR_G4 }}
          KEYCHAIN_PASS: ${{ secrets.HONGGUO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sign"
          mkdir -p "$WORK" && chmod 700 "$WORK"
          echo "$IOS_DIST_KEY_PEM" | base64 --decode > "$WORK/dist.key.pem"
          echo "$IOS_DIST_CERT"    | base64 --decode > "$WORK/dist.cer"
          echo "$IOS_WWDR_G4"      | base64 --decode > "$WORK/wwdr.cer"
          KEYCHAIN="$WORK/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          # security import 不吃裸 PEM 私钥 → 先合成 p12 再导入
          openssl pkcs12 -export -out "$WORK/dist.p12" \
            -inkey "$WORK/dist.key.pem" -in "$WORK/dist.cer" \
            -certfile "$WORK/wwdr.cer" -passout "pass:$KEYCHAIN_PASS"
          security import "$WORK/dist.p12" -k "$KEYCHAIN" -P "$KEYCHAIN_PASS" -T /usr/bin/codesign
          security import "$WORK/wwdr.cer" -k "$KEYCHAIN" -P "$KEYCHAIN_PASS"
          security set-key-partition-list -S apple-tool:,apple-codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login-keychain
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare profile and entitlements
        env:
          IOS_PROFILE_HONGGUO: ${{ secrets.IOS_PROFILE_HONGGUO }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sign"
          echo "$IOS_PROFILE_HONGGUO" | base64 --decode > "$WORK/appstore.mobileprovision"
          APP=$(find build/ship/Payload -maxdepth 1 -name '*.app')
          security cms -D -i "$WORK/appstore.mobileprovision" > "$WORK/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$WORK/profile.plist" \
            | sed -E 's/^<dict>/<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-\/\/Apple\/\/DTD PLIST 1.0\/\/EN" "http:\/\/www.apple.com\/DTDs\/PropertyList-1.0.dtd"><plist version="1.0"><dict>/; s/<\/dict>$/<\/dict><\/plist>/' \
            > "$WORK/entitlements.plist"
          xmllint --noout "$WORK/entitlements.plist"
          cp "$WORK/appstore.mobileprovision" "$APP/embedded.mobileprovision"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Codesign (replace signature)
        run: |
          set -euo pipefail
          APP="$APP_PATH"
          ID="Apple Distribution: Mike Zhang (MWFPLU44U9)"
          FRAMEWORKS=$(find "$APP" -path '*/Frameworks/*.framework' -maxdepth 3 2>/dev/null || true)
          DYLIBS=$(find "$APP/Frameworks" -maxdepth 1 -name '*.dylib' 2>/dev/null || true)
          for T in $FRAMEWORKS $DYLIBS; do
            /usr/bin/codesign --force --sign "$ID" --keychain "$SIGN_KEYCHAIN" --timestamp=none "$T"
          done
          /usr/bin/codesign --force --sign "$ID" \
            --entitlements "$RUNNER_TEMP/sign/entitlements.plist" \
            --keychain "$SIGN_KEYCHAIN" --timestamp=none "$APP"

      - name: Package and verify signed IPA
        run: |
          cd build/ship
          rm -f hongguo-ios-signed.ipa
          zip -qry hongguo-ios-signed.ipa Payload
          ls -la hongguo-ios-signed.ipa
          /usr/bin/codesign -v "$APP_PATH" --keychain "$SIGN_KEYCHAIN"
          echo "signature verify ok"

      - name: Upload to App Store Connect
        env:
          ASC_P8: ${{ secrets.ASC_P8_HONGGUO }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/asc_upload.py"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true

      - name: Upload signed IPA artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-ios-signed-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: client/build/ship/hongguo-ios-signed.ipa
          retention-days: 7
