name: Ship iOS to ASC
run-name: Ship iOS ${{ inputs.build_name }} (${{ inputs.build_number }}) → TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version shown to testers
        required: true
      build_number:
        description: Unique ascending Apple build number
        required: true

permissions:
  contents: read

concurrency:
  group: ship-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-upload:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned device app
        run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ship/Payload
          cp -R build/ios/iphoneos/Runner.app build/ship/Payload/
          cd build/ship
          zip -qry ../hongguo-ios-unsigned.ipa Payload

      - name: Import signing material into temporary keychain
        env:
          IOS_DIST_KEY_PEM: ${{ secrets.IOS_DIST_KEY_PEM }}
          IOS_DIST_CERT: ${{ secrets.IOS_DIST_CERT }}
          IOS_WWDR_G4: ${{ secrets.IOS_WWDR_G4 }}
          KEYCHAIN_PASS: ${{ secrets.HONGGUO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sign"
          mkdir -p "$WORK" && chmod 700 "$WORK"
          echo "$IOS_DIST_KEY_PEM" | base64 --decode > "$WORK/dist.key.pem"
          echo "$IOS_DIST_CERT"    | base64 --decode > "$WORK/dist.cer"
          echo "$IOS_WWDR_G4"      | base64 --decode > "$WORK/wwdr.cer"
          KEYCHAIN="$WORK/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$WORK/dist.key.pem" -k "$KEYCHAIN" -T /usr/bin/codesign -P "$KEYCHAIN_PASS"
          security import "$WORK/dist.cer"     -k "$KEYCHAIN" -P "$KEYCHAIN_PASS"
          security import "$WORK/wwdr.cer"     -k "$KEYCHAIN" -P "$KEYCHAIN_PASS"
          security set-key-partition-list -S apple-tool:,apple-codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login-keychain
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare profile and entitlements
        env:
          IOS_PROFILE_HONGGUO: ${{ secrets.IOS_PROFILE_HONGGUO }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/sign"
          echo "$IOS_PROFILE_HONGGUO" | base64 --decode > "$WORK/appstore.mobileprovision"
          APP=$(find build/ship/Payload -maxdepth 1 -name '*.app')
          security cms -D -i "$WORK/appstore.mobileprovision" > "$WORK/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$WORK/profile.plist" \
            | sed -E 's/^<dict>/<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-\/\/Apple\/\/DTD PLIST 1.0\/\/EN" "http:\/\/www.apple.com\/DTDs\/PropertyList-1.0.dtd"><plist version="1.0"><dict>/; s/<\/dict>$/<\/dict><\/plist>/' \
            > "$WORK/entitlements.plist"
          xmllint --noout "$WORK/entitlements.plist"
          cp "$WORK/appstore.mobileprovision" "$APP/embedded.mobileprovision"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Codesign (replace signature)
        run: |
          set -euo pipefail
          APP="$APP_PATH"
          ID="Apple Distribution: Mike Zhang (MWFPLU44U9)"
          FRAMEWORKS=$(find "$APP" -path '*/Frameworks/*.framework' -maxdepth 3 2>/dev/null || true)
          DYLIBS=$(find "$APP/Frameworks" -maxdepth 1 -name '*.dylib' 2>/dev/null || true)
          for T in $FRAMEWORKS $DYLIBS; do
            /usr/bin/codesign --force --sign "$ID" --keychain "$SIGN_KEYCHAIN" --timestamp=none "$T"
          done
          /usr/bin/codesign --force --sign "$ID" \
            --entitlements "$RUNNER_TEMP/sign/entitlements.plist" \
            --keychain "$SIGN_KEYCHAIN" --timestamp=none "$APP"

      - name: Package and verify signed IPA
        run: |
          cd build/ship
          rm -f hongguo-ios-signed.ipa
          zip -qry hongguo-ios-signed.ipa Payload
          ls -la hongguo-ios-signed.ipa
          /usr/bin/codesign -v "$APP_PATH" --keychain "$SIGN_KEYCHAIN"
          echo "signature verify ok"

      - name: Upload to App Store Connect
        env:
          ASC_P8: ${{ secrets.ASC_P8_HONGGUO }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          python3 - <<'PYEOF'
import base64, hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
import zipfile, plistlib

BASE = 'https://api.appstoreconnect.apple.com'
from pathlib import Path
ipa = Path('build/ship/hongguo-ios-signed.ipa')
p8 = base64.b64decode(os.environ['ASC_P8'])
key_id = os.environ['ASC_KEY_ID']
issuer = os.environ['ASC_ISSUER_ID']
app_id = os.environ['ASC_APP_ID']

# ---- ES256 JWT with pure-stdlib P-256 (scalar arithmetic mod curve order N) ----
def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
P  = 2**256 - 2**224 + 2**192 + 2**96 - 1          # field prime (coords)
N  = 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551  # group order (scalars)
A  = (P - 3) % P
Gx = 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296
Gy = 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5
def inv(a, m): return pow(a, -1, m)
def padd(p, q):
    if p is None: return q
    if q is None: return p
    if p[0] == q[0] and (p[1] + q[1]) % P == 0: return None
    if p == q: l = (3*p[0]*p[0] + A) * inv(2*p[1], P) % P
    else:      l = (q[1] - p[1]) * inv(q[0] - p[0], P) % P
    x = (l*l - p[0] - q[0]) % P
    return (x, (l*(p[0] - x) - p[1]) % P)
def pmul(k, p):
    r, p = None, p
    while k:
        if k & 1: r = padd(r, p)
        p = padd(p, p); k >>= 1
    return r
def der_rs(r, s):
    def part(n):
        b = n.to_bytes(32, 'big').lstrip(b'\x00') or b'\x00'
        if b[0] & 0x80: b = b'\x00' + b
        return bytes([0x02, len(b)]) + b
    body = part(r) + part(s)
    return bytes([0x30, len(body)]) + body

def load_scalar(p8):
    # Apple .p8 = PKCS#8 PEM wrapping SEC1 EC key; scalar lives after 02 01 01 04 20
    body = b''.join(l for l in p8.splitlines() if b'-----' not in l)
    der = base64.b64decode(body)
    marker = bytes([0x02, 0x01, 0x01, 0x04, 0x20])
    i = der.find(marker)
    assert i >= 0, 'unexpected p8 structure'
    return int.from_bytes(der[i+5:i+37], 'big')

d = load_scalar(p8) % N
now = int(time.time())
header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
payload = {"iss": issuer, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"}
si = (b64u(json.dumps(header, separators=(',', ':')).encode()) + '.' +
      b64u(json.dumps(payload, separators=(',', ':')).encode())).encode()
z = int.from_bytes(hashlib.sha256(si).digest(), 'big') % N
import random
k = random.randrange(1, N)
R = pmul(k, (Gx, Gy))[0] % N
S = (inv(k, N) * (z + R * d)) % N
if S > N // 2: S = N - S          # low-S, matches Apple/openssl convention
token = si.decode() + '.' + b64u(der_rs(R, S))
# self-verify: u1*G + u2*Q must recover x == R
w = inv(S, N)
u1, u2 = (z * w) % N, (R * w) % N
pt = padd(pmul(u1, (Gx, Gy)), pmul(u2, pmul(d, (Gx, Gy))))
assert pt is not None and pt[0] % N == R, 'JWT self-verify failed'
print('ES256 JWT signed + self-verified (mod-N math)')

def api(method, path, body=None):
    req = urllib.request.Request(BASE + path,
        data=json.dumps(body).encode() if body else None, method=method,
        headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
    try:
        with urllib.request.urlopen(req, timeout=120) as r:
            raw = r.read(); return json.loads(raw) if raw else {}
    except urllib.error.HTTPError as e:
        raise RuntimeError(f'Apple API HTTP {e.code}: ' + e.read().decode()[:1200]) from None

zf = zipfile.ZipFile(ipa)
app = [n for n in zf.namelist() if n.endswith('.app/Info.plist')][0]
pl = plistlib.loads(zf.read(app))
digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
print('IPA:', ipa.name, ipa.stat().st_size, 'B', pl['CFBundleShortVersionString'], pl['CFBundleVersion'])

apps = api('GET', '/v1/apps/' + urllib.parse.quote(app_id))
assert apps['data']['attributes']['bundleId'] == 'site.zhangyue.hongguo.ios', 'bundle mismatch'

upload = api('POST', '/v1/buildUploads', {'data': {'type': 'buildUploads', 'attributes': {
    'cfBundleShortVersionString': pl['CFBundleShortVersionString'],
    'cfBundleVersion': str(pl['CFBundleVersion']), 'platform': 'IOS'},
    'relationships': {'app': {'data': {'type': 'apps', 'id': app_id}}}}})
upload_id = upload['data']['id']
print('buildUpload created:', upload_id)

uf = api('POST', '/v1/buildUploadFiles', {'data': {'type': 'buildUploadFiles', 'attributes': {
    'assetType': 'ASSET', 'fileName': ipa.name, 'fileSize': ipa.stat().st_size, 'uti': 'com.apple.ipa'},
    'relationships': {'buildUpload': {'data': {'type': 'buildUploads', 'id': upload_id}}}}})
fid = uf['data']['id']
ops = uf['data']['attributes'].get('uploadOperations', [])
with ipa.open('rb') as src:
    for n, op in enumerate(ops, 1):
        assert urllib.parse.urlparse(op['url']).scheme == 'https'
        src.seek(op['offset']); chunk = src.read(op['length'])
        assert len(chunk) == op['length']
        req = urllib.request.Request(op['url'], data=chunk, method=op['method'],
            headers={h['name']: h['value'] for h in op.get('requestHeaders', [])})
        with urllib.request.urlopen(req, timeout=600) as r:
            assert 200 <= r.status < 300
        print(f'part {n}/{len(ops)}')
api('PATCH', '/v1/buildUploadFiles/' + fid, {'data': {
    'type': 'buildUploadFiles', 'id': fid, 'attributes': {'uploaded': True}}})
res = api('GET', '/v1/buildUploads/' + upload_id)
print(json.dumps({'uploadId': upload_id, 'state': res['data']['attributes']}, indent=2, default=str))
PYEOF

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true

      - name: Upload signed IPA artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-ios-signed-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: client/build/ship/hongguo-ios-signed.ipa
          retention-days: 7
